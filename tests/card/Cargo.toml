# SPDX-License-Identifier: Apache-2.0
[package]
name = "canokey-test-card"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[[bin]]
name = "apdu-replay"
path = "src/bin/replay.rs"
required-features = ["replay"]
[[bin]]
name = "apdu-fuzzer"
path = "src/bin/fuzz.rs"
required-features = ["fuzz"]
[[bin]]
name = "core-behavior"
path = "src/bin/behavior.rs"
required-features = ["behavior"]
[[bin]]
name = "runtime-composition"
path = "src/bin/composition.rs"
required-features = ["composition"]
[[bin]]
name = "hid-core-rust"
path = "src/bin/hid.rs"
required-features = ["transport-hid"]
[[bin]]
name = "usb-sessions-rust"
path = "src/bin/usb_sessions.rs"
required-features = ["transport-usb"]
[dependencies]
canokey-rust-core = { path = "../../crates/core" }
canokey-protocol = { path = "../../crates/protocol" }
canokey-ports = { path = "../../crates/ports", default-features = false, features = ["native-crypto"] }
canokey-rust-ffi = { path = "../../crates/ffi", optional = true, default-features = false }
libc = { version = "=0.2.189", optional = true }
libfuzzer-sys = { version = "=0.4.13", optional = true }
[features]
default = []
behavior = []
composition = ["dep:canokey-rust-ffi"]
transport-hid = ["composition", "ctap", "canokey-rust-ffi/usb-hid"]
transport-usb = ["transport-hid", "canokey-rust-ffi/usb-device", "canokey-rust-ffi/usb-webusb", "canokey-rust-ffi/usb-keyboard"]
replay = ["dep:libc"]
fuzz = ["dep:libfuzzer-sys", "dep:libc"]
admin = ["canokey-rust-core/admin", "canokey-rust-ffi?/admin"]
pass = ["canokey-rust-core/pass", "canokey-rust-ffi?/pass"]
oath = ["canokey-rust-core/oath", "canokey-rust-ffi?/oath"]
openpgp = ["canokey-rust-core/openpgp", "canokey-rust-ffi?/openpgp"]
piv = ["canokey-rust-core/piv", "canokey-rust-ffi?/piv"]
ctap = ["canokey-rust-core/ctap", "canokey-rust-ffi?/ctap"]
ndef = ["canokey-rust-core/ndef", "canokey-rust-ffi?/ndef"]
ctap-restrict-algorithms = ["ctap", "canokey-rust-core/ctap-restrict-algorithms"]
[lints]
workspace = true
