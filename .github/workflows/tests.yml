name: tests
on: [push, pull_request, workflow_dispatch]

jobs:
  rust_checks:
    name: Rust formatting, lints and supported profiles
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - run: rustup show active-toolchain
    - run: cargo fmt --all --check
    - name: Check native C formatting
      run: |
        python3 -m venv "$RUNNER_TEMP/format"
        "$RUNNER_TEMP/format/bin/pip" install clang-format==23.1.5
        git ls-files -z 'crates/*.c' 'crates/*.h' 'native/*.c' 'native/*.h' \
          'tests/*.c' 'tests/*.h' ':!crates/ports/include/port_abi.h' \
          | xargs -0 "$RUNNER_TEMP/format/bin/clang-format" --dry-run --Werror
    - name: Lint workspace style, complexity and safety
      shell: bash
      run: |
        # Preserve inline storage, explicit adapter scope and fixed frame geometry.
        layout=(-A clippy::large_enum_variant -A clippy::drop_non_drop
                -A clippy::chunks_exact_to_as_chunks)
        # Fixture signatures mirror production. Explicit constructors and compact
        # status types express API intent without adding unused default methods.
        api=(-A clippy::extra_unused_type_parameters -A clippy::new_without_default
             -A clippy::len_without_is_empty -A clippy::result_unit_err
             -A clippy::too_many_arguments -A clippy::type_complexity)
        # Keep existing match/branch and borrow structure at firmware dispatch
        # boundaries. Changing that structure needs a separate Flash/stack check.
        dispatch=(-A clippy::collapsible_if -A clippy::needless_borrow
                  -A clippy::needless_return -A clippy::unnecessary_mut_passed
                  -A clippy::redundant_closure_call -A clippy::manual_inspect
                  -A clippy::manual_map -A clippy::needless_range_loop
                  -A clippy::manual_is_multiple_of -A clippy::redundant_pattern_matching
                  -A clippy::map_or_identity -A clippy::manual_range_patterns)
        # Keep existing fixture assertion wording and placement.
        fixtures=(-A clippy::items_after_test_module -A clippy::bool_assert_comparison
                  -A clippy::int_plus_one -A clippy::redundant_field_names
                  -A clippy::redundant_closure)
        cargo clippy --workspace --all-targets --all-features -- \
          -D warnings -D clippy::style -D clippy::complexity \
          "${layout[@]}" "${api[@]}" "${dispatch[@]}" "${fixtures[@]}"
    - name: Check transport integer conversions
      run: >-
        cargo clippy --no-deps -p canokey-rust-ffi -p canokey-protocol
        -p canokey-transport-runtime --all-targets --all-features --
        -A clippy::all -D clippy::cast_possible_truncation
    - run: python3 tests/check_rust_profiles.py
    - name: Test synchronization gate and validate draft records (not release acceptance)
      run: |
        python3 -m unittest discover -s tests -p test_c312_sync.py -v
        python3 tests/check_c312_sync.py --structure-only

  rust_feature_tests:
    name: ${{ matrix.package }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - { package: canokey-rust-core, profile: none, features: "" }
        - { package: canokey-rust-core, profile: admin, features: admin }
        - { package: canokey-rust-core, profile: pass, features: pass }
        - { package: canokey-rust-core, profile: oath, features: oath }
        - { package: canokey-rust-core, profile: openpgp, features: openpgp }
        - { package: canokey-rust-core, profile: piv, features: piv }
        - { package: canokey-rust-core, profile: ctap, features: ctap }
        - { package: canokey-rust-core, profile: ndef, features: ndef }
        - { package: canokey-rust-core, profile: full, features: "admin,pass,oath,openpgp,piv,ctap,ndef" }
        - { package: canokey-rust-ffi, profile: none, features: "" }
        - { package: canokey-rust-ffi, profile: ctap, features: ctap }
        - { package: canokey-rust-ffi, profile: full, features: "admin,pass,oath,openpgp,piv,ctap,ndef" }
        # CTAP exposes mechanism features rather than applet selectors.
        - { package: canokey-ctap, profile: none, features: "" }
        - { package: canokey-ctap, profile: ctap, features: streaming }
        - { package: canokey-ctap, profile: full, features: "streaming,schema" }
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - run: cargo test -p "${{ matrix.package }}" --no-default-features --features "${{ matrix.features }}"

  fuzz:
    name: APDU corpus and bounded fuzzing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false
    - run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
    - run: rustup show active-toolchain
    - run: >-
        cmake -S . -B build/fuzz -DCMAKE_C_COMPILER=clang
        -DCANOKEY_FUZZING=ON -DCANOKEY_VIRTUAL_CARD=OFF
    - run: cmake --build build/fuzz --target apdu-fuzzer --parallel 4
    - run: ctest --test-dir build/fuzz -R '^fuzz-smoke$' --output-on-failure

  build_tools:
    name: Build custom yubico-piv-tool package
    #if: github.event_name == 'workflow_dispatch'
    # Match the consumer's distribution so cached debs use the same runtime ABI.
    runs-on: ubuntu-24.04
    steps:
    - name: Cache deb files
      uses: actions/cache@v6
      env:
        cache-name: tools-deb
      with:
        path: |
          yubico-piv-tool_*.deb
          libykpiv1_*.deb
        key: ${{ runner.os }}-ubuntu-24.04-${{ env.cache-name }}
    - name: Check file existence
      id: check_yubico_piv
      run: |
        if test -n "$(find . -maxdepth 1 -name 'yubico-piv-tool_*.deb' -print)"; then
          echo "need_build=false" >> "$GITHUB_OUTPUT"
        else
          echo "need_build=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Package Install
      if: steps.check_yubico_piv.outputs.need_build == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -q -y build-essential cmake devscripts equivs
    - name: Build yubico-piv-tool package
      if: steps.check_yubico_piv.outputs.need_build == 'true'
      run: |
        set -x
        git clone https://github.com/z4yx/yubico-piv-tool.git
        sudo mk-build-deps yubico-piv-tool/debian/control -i
        rm -f -- *.deb # remove build-deps pseudo package
        cd yubico-piv-tool
        eval "$(dpkg-architecture -s)"
        dpkg-buildpackage -b -uc -us --no-sign
        rm -rf ../*dbgsym*.deb
        DEB_SUFFIX="$(dpkg-parsechangelog | sed -n 's/^Version: //p')_${DEB_HOST_ARCH}"
        sudo apt-get install -q -y "../yubico-piv-tool_${DEB_SUFFIX}.deb" "../libykpiv1_${DEB_SUFFIX}.deb" # test installation
    - name: Upload package files
      uses: actions/upload-artifact@v7
      with:
        name: tools-deb
        path: "*.deb"

  build_test:
    name: Build and Test
    # The pinned pinentry 1.2.1 mock requires libassuan API 2 from this image.
    runs-on: ubuntu-24.04
    needs: build_tools
    steps:
    - name: Prepare - Download packages
      uses: actions/download-artifact@v8
      with:
        name: tools-deb

    - name: Prepare - Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -q -y gpg scdaemon opensc libeac3 git build-essential cmake swig psmisc procps pcscd pcsc-tools libhidapi-dev libnpth0-dev libssl-dev zlib1g libglib2.0-0 openssl openssh-server libpcsclite-dev libudev-dev libcbor-dev libcmocka-dev python3-pip python3-venv python3-setuptools python3-wheel lcov yubikey-manager
        sudo apt-get install -q -y ./yubico-piv-tool_*.deb ./libykpiv1_*.deb

    - name: Prepare - Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Prepare - Checkout piv-go
      uses: actions/checkout@v7
      with:
        repository: canokeys/piv-go
        ref: 130e11e87b5f5ec788a12037735c86a0d2c7c547
        path: piv-go
        persist-credentials: false

    - name: Prepare - Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: "^1.24"
        cache-dependency-path: |
          tests/pcsc/go.sum
          piv-go/go.mod

    - name: Cache - Patched GnuPG
      id: cache-gpg
      uses: actions/cache@v6
      env:
        cache-name: cache_gpg_binary
      with:
        path: gnupg
        key: ${{ runner.os }}-ubuntu-24.04-build-${{ env.cache-name }}-${{ hashFiles('./tests/pcsc/build_gpg.sh') }}

    - name: Cache - FIDO tools
      id: cache-fido
      uses: actions/cache@v6
      env:
        cache-name: cache_fido_tools
      with:
        path: |
          u2f-ref-code
          libfido2
          fido2-tests
        key: ${{ runner.os }}-ubuntu-24.04-build-${{ env.cache-name }}-${{ hashFiles('./tests/pcsc/build_fido_tests.sh') }}

    - name: Build - Patched GnuPG
      if: steps.cache-gpg.outputs.cache-hit != 'true'
      run: ./tests/pcsc/build_gpg.sh

    - name: Install - Patched GnuPG
      run: |
        ./tests/pcsc/install_gpg.sh
        gpg --version

    - name: Build - FIDO tests
      if: steps.cache-fido.outputs.cache-hit != 'true'
      run: ./tests/pcsc/build_fido_tests.sh

    - name: Install - FIDO tests
      run: |
        ./tests/pcsc/install_fido_tests.sh
        fido2-tests/.venv/bin/python - <<'PY'
        import importlib.metadata
        import pathlib
        import sys
        import fido2

        print("python:", sys.executable)
        print("fido2_version:", importlib.metadata.version("fido2"))
        print("fido2_path:", pathlib.Path(fido2.__file__).resolve())
        PY
        which fido2-token
        ldd "$(command -v fido2-token)"

    - name: Install - Rust virtual card toolchain and tests
      run: |
        rustup show active-toolchain
        python3 -m venv .venv-host
        .venv-host/bin/python -m pip install -r tests/integration/requirements.txt

    - name: Build - CanoKey tests
      run: |
        mkdir build && pushd build
        cmake .. -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
          -DCANOKEY_VERSIONS_FILE="$GITHUB_WORKSPACE/tests/pcsc/versions.cmake" \
          -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv-host/bin/python"
        make -j2
      
    - name: Prepare - Start SSH server
      run: |
        cat >/tmp/sshd_config <<EOF
        StrictModes no
        UsePAM yes
        Port 2200
        EOF
        sudo mkdir -p /run/sshd
        sudo /usr/sbin/sshd -f /tmp/sshd_config

    - name: Tests - Smoking tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Prepare - Start pcscd
      run: |
        echo 0 >/tmp/canokey-test-up && echo 0 >/tmp/canokey-test-nfc # Emulate the USB mode
        sudo killall -9 pcscd || true
        sudo cp build/libu2f-virt-card.so /usr/local/lib/
        sudo cp tests/pcsc/pcscd-reader.conf /etc/reader.conf.d/
        bash -c 'sudo CANOKEY_TEST_NFC_AUTO_TAP=1 LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libubsan.so)" pcscd --disable-polkit -a -f >/tmp/pcscd.log &'
        sleep 15 # wait for admin applet reset
        timeout 1s pcsc_scan || true
        go env -w GO111MODULE=on
        sudo chmod 777 /tmp/canokey-*
        sudo chown root:root /tmp/canokey-*
        ls -l /tmp

    - name: Tests - Admin applet
      run: go -C tests/pcsc test -v admin_test.go

    - name: Tests - NDEF applet
      run: go -C tests/pcsc test -v ndef_test.go

    - name: Tests - FIDO2 applet
      timeout-minutes: 8
      run: |
        echo 1 >/tmp/canokey-test-nfc # Emulate the NFC mode for PCSC/NFC tests
        cd fido2-tests
        .venv/bin/python -m pytest --color=yes --vendor canokeys --nfc tests/standard/
        .venv/bin/python -m pytest --color=yes --vendor canokeys --nfc \
          --ignore=tests/vendor/canokeys/test_mldsa65.py tests/vendor/canokeys/

    - name: Tests - CTAPHID applet
      run: |
        rm -f /tmp/canokey-fido-hid-over-udp-lfs-root
        CANOKEY_VIRT_NFC=0 CANOKEY_VIRT_RESET_STORAGE=1 build/fido-hid-over-udp >/tmp/fido-hid-over-udp.log 2>&1 &
        echo $! >/tmp/fido-hid-over-udp.pid
        trap 'kill "$(cat /tmp/fido-hid-over-udp.pid)" 2>/dev/null || true; tail -n 200 /tmp/fido-hid-over-udp.log || true' EXIT
        cd fido2-tests
        .venv/bin/python - <<'PY'
        import sys
        import time

        sys.path.insert(0, ".")
        from tests.vendor.solo.udp_backend import force_udp_backend

        force_udp_backend()

        from fido2.hid import CtapHidDevice, CTAPHID

        deadline = time.time() + 30
        last_error = None
        while time.time() < deadline:
            try:
                dev = next(CtapHidDevice.list_devices())
                nonce = b"12345678"
                if dev.call(CTAPHID.INIT, nonce)[:8] != nonce:
                    raise RuntimeError("CTAPHID INIT nonce mismatch")
                if dev.call(CTAPHID.PING, b"ping") != b"ping":
                    raise RuntimeError("CTAPHID PING mismatch")
                print("CTAPHID simulator is ready")
                break
            except Exception as exc:
                last_error = exc
                time.sleep(1)
        else:
            raise last_error
        PY
        .venv/bin/python - <<'PY'
        import sys

        sys.path.insert(0, ".")
        from tests.vendor.solo.udp_backend import force_udp_backend

        force_udp_backend()

        from fido2.ctap2 import Ctap2
        from fido2.hid import CtapHidDevice, CTAPHID

        dev = next(CtapHidDevice.list_devices())
        nonce = b"abcdefgh"
        assert dev.call(CTAPHID.INIT, nonce)[:8] == nonce
        assert dev.call(CTAPHID.PING, b"ping") == b"ping"
        assert dev.call(CTAPHID.WINK, b"") == b""
        info = Ctap2(dev).get_info()
        assert "FIDO_2_0" in info.versions
        print("CTAPHID smoke checks passed")
        PY
        .venv/bin/python -m pytest --color=yes --vendor canokeys --sim tests/standard/connect_test.py
        .venv/bin/python -m pytest --color=yes --vendor canokeys --sim tests/standard/fido2/test_getinfo.py
        .venv/bin/python -m pytest --color=yes --vendor canokeys --sim tests/vendor/canokeys/test_mldsa65.py -s
        kill "$(cat /tmp/fido-hid-over-udp.pid)" || true
        trap - EXIT

    - name: Tests - U2F applet
      timeout-minutes: 5
      run: |
        echo 1 >/tmp/canokey-test-nfc
        echo 0 | ./u2f-ref-code/u2f-tests/NFC/u2f_nfc_test -v | tee /tmp/u2f_nfc_test.log
        test "$(grep -c 'PASS(signCheckSignature(regReq, regRsp, authReq, authRsp, rapduLen))' /tmp/u2f_nfc_test.log)" -eq 6

    - name: Tests - OATH applet
      run: |
        echo 0 >/tmp/canokey-test-nfc
        go -C tests/pcsc test -v oath_test.go

    - name: Tests - OpenPGP applet
      # GPG requires a tty to work
      shell: script -e -c "bash {0}"
      run: bash tests/hardware/test-virtual-openpgp.sh
    - name: Tests - PIV applet
      run: bash tests/hardware/test-virtual-piv.sh
    - name: Wrap-up - Prepare test coverage report
      run: |
        go -C tests/pcsc test admin_test.go -v -run TestFSUsage
        kill "$(cat /tmp/fido-hid-over-udp.pid)" 2>/dev/null || true
        sudo killall pcscd || true # To flush cov files
        ls /tmp
        sleep 2
        mkdir coverage
        find build/ -name '*.gcda' | grep -P '/(canokey-crypto|littlefs)/' | xargs -r rm
        lcov --base-directory . --directory . -c -o ./coverage/lcov.info

    - name: Wrap-up - Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Wrap-up - Upload log files
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: logs
        path: /tmp/*.log
    
    - name: Wrap-up - Collect virtual-card image
      if: ${{ always() }}
      run: |
        mkdir -p test-artifacts
        if sudo test -f /tmp/lfs-root; then
          # The image is root-owned and the artifact goes to the runner workspace.
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 /tmp/lfs-root test-artifacts/virtual-card.image
        fi

    - name: Wrap-up - Upload data files
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: data
        path: test-artifacts/
