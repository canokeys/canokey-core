# SPDX-License-Identifier: Apache-2.0
[workspace]
members = ["crates/protocol", "crates/ports", "crates/native-crypto", "crates/core", "crates/ffi", "crates/host", "tests/card"]
exclude = ["third_party/minicbor"]
resolver = "3"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

# Native fixture archives do not need firmware whole-program optimization.
[profile.host-test]
inherits = "release"
lto = false
codegen-units = 16

[workspace.lints.rust]
warnings = "deny"
