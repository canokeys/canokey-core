# SPDX-License-Identifier: Apache-2.0
[package]
name = "canokey-ports"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[features]
nfc = []
ndef = ["storage"]
dynamic-backend = []
default = []
static-backend = []
storage = []
platform-device = []
platform-serial = []
platform-hmac = []
platform-key = []
platform-random = []
platform-mac = ["platform-random"]
platform-stream = []
platform-stage = []
admin = ["storage", "platform-device"]
ctap = ["storage", "platform-device", "platform-serial", "platform-mac", "platform-stream", "platform-key", "platform-stage"]
openpgp = ["storage", "platform-device", "platform-serial", "platform-random", "platform-key"]
piv = ["storage", "platform-device", "platform-serial", "platform-random", "platform-stream", "platform-key", "platform-stage"]
pass = ["storage", "platform-device", "platform-hmac"]
oath = ["storage", "platform-device", "platform-serial", "platform-mac"]

[lints]
workspace = true
