# SPDX-License-Identifier: Apache-2.0
[package]
name = "canokey-rust-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[dependencies]
canokey-ports = { path = "../ports" }
canokey-protocol = { path = "../protocol" }
canokey-rust-core = { path = "../core" }
[features]
device-runtime = ["usb-device", "canokey-ports/device-runtime"]
nfc = ["ndef", "usb-device", "canokey-ports/nfc"]
ndef = ["canokey-rust-core/ndef", "canokey-ports/ndef", "storage"]
dynamic-backend = ["canokey-ports/dynamic-backend"]
static-backend = ["canokey-ports/static-backend"]
usb-ccid = []
usb-device = ["usb-ccid"]
usb-webusb = ["usb-device"]
usb-hid = ["ctap"]
usb-keyboard = ["pass"]
storage = ["canokey-ports/storage"]
platform-device = ["canokey-ports/platform-device"]
platform-serial = ["canokey-ports/platform-serial"]
# Fixed 20-byte HMAC-SHA1 keys are used by PASS only.
platform-hmac = ["canokey-ports/platform-hmac"]
platform-key = ["canokey-ports/platform-key"]
# Randomness must not retain the MAC vtable implementation in PIV/OpenPGP.
platform-random = ["canokey-ports/platform-random"]
platform-mac = ["platform-random", "canokey-ports/platform-mac"]
platform-stream = ["canokey-ports/platform-stream"]
platform-stage = ["canokey-ports/platform-stage"]
admin = ["canokey-rust-core/admin", "storage", "platform-device", "canokey-ports/admin"]
ctap = ["canokey-rust-core/ctap", "storage", "platform-device", "platform-serial", "platform-mac", "platform-stream", "platform-key", "platform-stage", "canokey-ports/ctap"]
openpgp = ["canokey-rust-core/openpgp", "storage", "platform-device", "platform-serial", "platform-random", "platform-key", "canokey-ports/openpgp"]
piv = ["canokey-rust-core/piv", "storage", "platform-device", "platform-serial", "platform-random", "platform-stream", "platform-key", "platform-stage", "canokey-ports/piv"]

default = []
pass = ["canokey-rust-core/pass", "storage", "platform-device", "platform-hmac", "canokey-ports/pass"]
oath = ["canokey-rust-core/oath", "storage", "platform-device", "platform-serial", "platform-mac", "canokey-ports/oath"]
host-runtime = []

[lints]
workspace = true
