# SPDX-License-Identifier: Apache-2.0
[package]
name = "canokey-rust-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[dependencies]
canokey-protocol = { path = "../protocol" }
canokey-rust-core = { path = "../core" }
[features]
usb-ccid = []
storage = []
platform-device = []
platform-serial = []
# Fixed 20-byte HMAC-SHA1 keys are used by PASS only.
platform-hmac = []
platform-key = []
# Randomness must not retain the MAC vtable implementation in PIV/OpenPGP.
platform-random = []
platform-mac = ["platform-random"]
platform-stream = []
platform-stage = []
admin = ["canokey-rust-core/admin", "storage", "platform-device"]
ctap = ["canokey-rust-core/ctap", "storage", "platform-device", "platform-serial", "platform-mac", "platform-stream", "platform-key", "platform-stage"]
openpgp = ["canokey-rust-core/openpgp", "storage", "platform-device", "platform-serial", "platform-random", "platform-key"]
piv = ["canokey-rust-core/piv", "storage", "platform-device", "platform-serial", "platform-random", "platform-stream", "platform-key", "platform-stage"]

default = []
pass = ["canokey-rust-core/pass", "storage", "platform-device", "platform-hmac"]
oath = ["canokey-rust-core/oath", "storage", "platform-device", "platform-serial", "platform-mac"]
host-runtime = []

[lints]
workspace = true
