# SPDX-License-Identifier: Apache-2.0
[package]
name = "canokey-rust-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"
[dependencies]
canokey-ports = { path = "../ports" }
canokey-protocol = { path = "../protocol" }
[build-dependencies]
cfg_aliases = "0.2.1"
minicbor = { version = "=2.3.0", path = "../../minicbor/minicbor", features = ["std"] }
[features]
dynamic-backend = ["canokey-ports/dynamic-backend"]
static-backend = ["canokey-ports/static-backend"]
admin = ["canokey-ports/admin"]
ctap = ["canokey-ports/ctap"]
openpgp = ["canokey-ports/openpgp"]
piv = ["canokey-ports/piv"]

default = []
pass = ["canokey-ports/pass"]
oath = ["canokey-ports/oath"]

[dev-dependencies]
sha2 = "0.10.9"

[lints]
workspace = true
