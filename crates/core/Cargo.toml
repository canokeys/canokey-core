# SPDX-License-Identifier: Apache-2.0
[package]
name = "canokey-rust-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = "build.rs"
[dependencies]
canokey-ctap = { path = "../ctap" }
canokey-transport-runtime = { path = "../transport-runtime" }
canokey-ports = { path = "../ports", default-features = false }
canokey-protocol = { path = "../protocol" }
[build-dependencies]
canokey-ports = { path = "../ports", default-features = false }
canokey-protocol = { path = "../protocol" }
cfg_aliases = "0.2.1"
minicbor = { version = "=2.3.0", path = "../../third_party/minicbor/minicbor", features = ["std"] }
[features]
# Declares the product NFC capability without installing the CTAP applet.
ctap-nfc = []
ctap-restrict-algorithms = ["ctap"]
ndef = ["canokey-ports/ndef"]
dynamic-backend = ["canokey-ports/dynamic-backend"]
static-backend = ["canokey-ports/static-backend"]
admin = ["canokey-ports/admin"]
ctap = ["canokey-ports/ctap"]
openpgp = ["canokey-ports/openpgp"]
piv = ["canokey-ports/piv"]

default = []
pass = ["canokey-ports/pass"]
oath = ["canokey-ports/oath"]

[dev-dependencies]
canokey-ports = { path = "../ports", features = ["dynamic-backend"] }
sha2 = "0.10.9"

[lints]
workspace = true
